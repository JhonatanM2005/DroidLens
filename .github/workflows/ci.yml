name: DroidLens CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    name: Windows C++ Driver, Tests, Portable ZIP & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
          } else {
            $v = (Get-Content -Path "VERSION" -Raw).Trim().TrimStart('v', 'V')
          }
          echo "DROIDLENS_VERSION=$v" >> $env:GITHUB_ENV
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved DroidLens version: $v"

      - name: Configure MSVC x64 Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Native Windows 11 IMFVirtualCamera Driver (DroidLensMF.dll)
        run: |
          cmd /c driver\mf_vcam\build_mf_driver.bat
          if (-not (Test-Path "driver\DroidLensMF.dll")) {
            Write-Error "DroidLensMF.dll was not generated!"
            exit 1
          }

      - name: Upload Compiled DroidLensMF.dll Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidLensMF-Driver-DLL
          path: driver/DroidLensMF.dll

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc_client/requirements-dev.txt

      - name: Run Pytest Suite
        run: |
          pytest pc_client/tests -v

      - name: Build Windows Distribution (PyInstaller + Inno Setup)
        run: |
          python scripts/build_windows_dist.py

      - name: Upload Windows Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidLens-Windows-Dist
          path: |
            dist/DroidLens-Windows-Portable-v*.zip
            dist/DroidLens-Setup-v*.exe

  android-build:
    name: Android Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            V="${V#V}"
          else
            V="$(tr -d '[:space:]' < VERSION | sed 's/^[vV]//')"
          fi
          echo "DROIDLENS_VERSION=${V}" >> "${GITHUB_ENV}"
          echo "version=${V}" >> "${GITHUB_OUTPUT}"
          echo "Resolved DroidLens version: ${V}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../DroidLens.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidLens-Android-APK
          path: DroidLens.apk

  release:
    name: Publish GitHub Release (CD)
    needs: [ windows-build, android-build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DroidLens-Windows-Dist
          path: release_assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: DroidLens-Android-APK
          path: release_assets

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/DroidLens-Setup-v*.exe
            release_assets/DroidLens-Windows-Portable-v*.zip
            release_assets/DroidLens.apk
