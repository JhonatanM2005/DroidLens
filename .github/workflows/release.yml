name: Release Workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidlens-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows Client & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc_client/requirements-dev.txt

      - name: Build Windows Dist (PyInstaller & Inno Setup)
        run: python scripts/build_windows_dist.py

      - name: Upload Windows Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/DroidLens-Setup-*.exe
            dist/DroidLens-Windows-Portable-*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: droidlens-apk
          path: release_assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release_assets/

      - name: Rename APK for Release
        run: |
          mv release_assets/app-debug.apk release_assets/DroidLens.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
